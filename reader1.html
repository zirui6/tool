<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>免费小说阅读器</title>
<style>
  :root {
    --bg: #f5f0e8;
    --card: #fffdf8;
    --text: #3a3a3a;
    --text-light: #8a8278;
    --accent: #6b5b4f;
    --border: #e0d8cc;
    --radius: 12px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.8;
    min-height: 100vh;
  }
  .container { max-width: 800px; margin: 0 auto; padding: 20px 16px 60px; }

  /* 顶部导航 */
  .navbar {
    display: flex; align-items: center; gap: 12px;
    padding: 16px 0; border-bottom: 1px solid var(--border);
    margin-bottom: 20px;
  }
  .navbar .logo { font-size: 20px; font-weight: 700; color: var(--accent); }
  .navbar .back-btn {
    display: none; cursor: pointer; font-size: 14px;
    color: var(--accent); padding: 6px 12px;
    border: 1px solid var(--border); border-radius: 8px;
    background: var(--card); transition: background .2s;
  }
  .navbar .back-btn:hover { background: #f0e9df; }
  .navbar .back-btn.visible { display: inline-block; }

  /* 搜索栏 */
  .search-bar { display: flex; gap: 8px; margin-bottom: 16px; }
  .search-bar input {
    flex: 1; padding: 12px 16px; font-size: 15px;
    border: 1px solid var(--border); border-radius: var(--radius);
    background: var(--card); color: var(--text); outline: none;
    transition: border-color .2s;
  }
  .search-bar input:focus { border-color: var(--accent); }
  .search-bar button {
    padding: 12px 24px; font-size: 15px; font-weight: 600;
    background: var(--accent); color: #fff; border: none;
    border-radius: var(--radius); cursor: pointer;
    transition: opacity .2s;
  }
  .search-bar button:hover { opacity: .85; }
  .search-bar button:disabled { opacity: .4; cursor: not-allowed; }

  /* 分类标签栏 */
  .category-bar {
    display: flex; gap: 8px; overflow-x: auto;
    padding-bottom: 6px; margin-bottom: 18px;
    scrollbar-width: none;
  }
  .category-bar::-webkit-scrollbar { display: none; }
  .cat-btn {
    flex-shrink: 0; padding: 8px 16px; font-size: 13px;
    border: 1px solid var(--border); border-radius: 20px;
    background: var(--card); color: var(--text); cursor: pointer;
    transition: all .2s; white-space: nowrap;
  }
  .cat-btn:hover { background: #f0e9df; }
  .cat-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }

  /* 列表头部 */
  .list-header {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 12px; min-height: 32px;
  }
  .list-header .title { font-size: 15px; font-weight: 600; color: var(--accent); }
  .refresh-btn {
    padding: 6px 14px; font-size: 13px;
    border: 1px solid var(--border); border-radius: 8px;
    background: var(--card); color: var(--text); cursor: pointer;
    transition: background .2s;
  }
  .refresh-btn:hover { background: #f0e9df; }
  .refresh-btn:disabled { opacity: .4; cursor: not-allowed; }

  /* 书籍列表 */
  .book-list { display: flex; flex-direction: column; gap: 12px; }
  .book-item {
    display: flex; gap: 14px; padding: 16px;
    background: var(--card); border: 1px solid var(--border);
    border-radius: var(--radius); cursor: pointer;
    transition: box-shadow .2s, transform .15s;
  }
  .book-item:hover { box-shadow: 0 4px 16px rgba(0,0,0,.08); transform: translateY(-2px); }
  .book-item img {
    width: 70px; height: 96px; object-fit: cover;
    border-radius: 6px; background: #eee; flex-shrink: 0;
  }
  .book-item .info { flex: 1; min-width: 0; }
  .book-item .info h3 {
    font-size: 16px; margin-bottom: 4px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .book-item .info .meta {
    font-size: 13px; color: var(--text-light); margin-bottom: 6px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .book-item .info .intro {
    font-size: 13px; color: var(--text-light);
    display: -webkit-box; -webkit-line-clamp: 2;
    -webkit-box-orient: vertical; overflow: hidden;
  }

  /* 详情页 */
  .detail-header {
    display: flex; gap: 20px; margin-bottom: 24px;
    padding: 20px; background: var(--card);
    border: 1px solid var(--border); border-radius: var(--radius);
  }
  .detail-header img {
    width: 100px; height: 140px; object-fit: cover;
    border-radius: 8px; background: #eee; flex-shrink: 0;
  }
  .detail-header .info h2 { font-size: 20px; margin-bottom: 6px; }
  .detail-header .info .meta { font-size: 13px; color: var(--text-light); margin-bottom: 8px; }
  .detail-header .info .desc { font-size: 13px; color: var(--text-light); line-height: 1.6; }

  .chapter-list { display: flex; flex-direction: column; }
  .chapter-item {
    padding: 12px 16px; font-size: 14px;
    border-bottom: 1px solid var(--border);
    cursor: pointer; transition: background .15s;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .chapter-item:hover { background: #f0e9df; }
  .chapter-item.read { color: var(--text-light); }

  /* 阅读页 */
  .reader-content { padding: 24px 0; font-size: 17px; line-height: 2.0; word-break: break-word; }
  .reader-content p { margin-bottom: 1em; text-indent: 2em; }
  .reader-title {
    font-size: 18px; font-weight: 600; margin-bottom: 20px;
    padding-bottom: 12px; border-bottom: 1px solid var(--border);
  }
  .reader-nav {
    display: flex; justify-content: space-between; align-items: center;
    padding: 20px 0; border-top: 1px solid var(--border); margin-top: 20px;
  }
  .reader-nav button {
    padding: 10px 20px; font-size: 14px;
    border: 1px solid var(--border); border-radius: 8px;
    background: var(--card); color: var(--text);
    cursor: pointer; transition: background .2s;
  }
  .reader-nav button:hover { background: #f0e9df; }
  .reader-nav button:disabled { opacity: .3; cursor: not-allowed; }
  .reader-nav .page-info { font-size: 13px; color: var(--text-light); }

  /* 状态提示 */
  .status { text-align: center; padding: 48px 16px; color: var(--text-light); font-size: 15px; }
  .status .spinner {
    display: inline-block; width: 28px; height: 28px;
    border: 3px solid var(--border); border-top-color: var(--accent);
    border-radius: 50%; animation: spin .8s linear infinite; margin-bottom: 12px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .hidden { display: none !important; }
</style>
</head>
<body>
<div class="container">

  <!-- 导航栏 -->
  <div class="navbar">
    <button class="back-btn" id="backBtn" onclick="goBack()">← 返回</button>
    <span class="logo">📖 免费小说阅读器</span>
  </div>

  <!-- 首页视图（推荐 + 搜索） -->
  <div id="viewSearch">
    <div class="search-bar">
      <input type="text" id="searchInput" placeholder="输入书名或作者名…"
             onkeydown="if(event.key==='Enter')doSearch()">
      <button id="searchBtn" onclick="doSearch()">搜索</button>
    </div>

    <!-- 分类标签栏 -->
    <div class="category-bar" id="categoryBar"></div>

    <!-- 列表头部 -->
    <div class="list-header" id="listHeader">
      <span class="title" id="listTitle">🔥 热门推荐</span>
      <button class="refresh-btn" id="refreshBtn" onclick="refreshList()">换一批</button>
    </div>

    <div id="searchResults"></div>
  </div>

  <!-- 详情视图 -->
  <div id="viewDetail" class="hidden"></div>

  <!-- 阅读视图 -->
  <div id="viewReader" class="hidden"></div>

</div>

<script>
/* ============================================
 *  配置
 * ============================================ */
const API_BASE = 'https://novel.juhe.im';

// 推荐分类池（点击标签即按该关键词推荐）
const CATEGORIES = ['玄幻', '都市', '修真', '历史', '科幻', '悬疑', '言情', '武侠', '穿越', '重生'];

/* ============================================
 *  全局状态
 * ============================================ */
let currentBook = null;
let currentChapters = [];
let currentChapterIndex = 0;
let readSet = new Set();
let currentCategory = '';   // '' 表示随机综合推荐
let currentMode = 'recommend'; // 'recommend' | 'search'

/* ============================================
 *  视图切换
 * ============================================ */
function showView(name) {
  document.getElementById('viewSearch').classList.toggle('hidden', name !== 'search');
  document.getElementById('viewDetail').classList.toggle('hidden', name !== 'detail');
  document.getElementById('viewReader').classList.toggle('hidden', name !== 'reader');
  document.getElementById('backBtn').classList.toggle('visible', name !== 'search');
}

/* ============================================
 *  工具函数
 * ============================================ */
function setStatus(el, html) {
  el.innerHTML = `<div class="status">${html}</div>`;
}
function loadingHTML(msg = '加载中…') {
  return `<div class="spinner"></div><div>${msg}</div>`;
}
function errorHTML(msg = '加载失败，请重试') {
  return `<div style="font-size:40px;margin-bottom:8px;">😕</div><div>${msg}</div>`;
}
function escapeHtml(str) {
  return String(str || '')
    .replace(/&/g, '&amp;').replace(/</g, '&lt;')
    .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}
function placeholderCover(w, h) {
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}">
    <rect fill="#e0d8cc" width="${w}" height="${h}"/>
    <text x="${w / 2}" y="${h / 2 + 10}" text-anchor="middle" fill="#8a8278"
      font-size="${Math.min(w, h) * 0.45}">📕</text></svg>`;
  return 'data:image/svg+xml,' + encodeURIComponent(svg);
}
function coverImg(url, w, h, radius = '6px') {
  const ph = placeholderCover(w, h);
  return `<img src="${url ? escapeHtml(url) : ph}" alt=""
            style="border-radius:${radius}"
            onerror="this.onerror=null;this.src='${ph}'">`;
}

/* ============================================
 *  分类标签渲染
 * ============================================ */
function renderCategories() {
  const bar = document.getElementById('categoryBar');
  let html = `<button class="cat-btn ${currentCategory === '' ? 'active' : ''}"
                onclick="loadRecommend('')">🔥 推荐</button>`;
  CATEGORIES.forEach(cat => {
    html += `<button class="cat-btn ${currentCategory === cat ? 'active' : ''}"
               onclick="loadRecommend('${cat}')">${cat}</button>`;
  });
  bar.innerHTML = html;
}

/* ============================================
 *  渲染书籍列表
 * ============================================ */
function renderBooks(books, container) {
  if (!books.length) {
    setStatus(container,
      '<div style="font-size:40px;margin-bottom:8px;">🔍</div><div>没有找到相关书籍</div>');
    return;
  }
  let html = '<div class="book-list">';
  books.forEach(book => {
    html += `
      <div class="book-item" onclick="openBook('${escapeHtml(book._id)}')">
        ${coverImg(book.cover, 70, 96)}
        <div class="info">
          <h3>${escapeHtml(book.title)}</h3>
          <div class="meta">${escapeHtml(book.author)} · ${escapeHtml(book.cat || '')} · ${escapeHtml(book.zt || '')}</div>
          <div class="intro">${escapeHtml(book.shortIntro || '暂无简介')}</div>
        </div>
      </div>`;
  });
  html += '</div>';
  container.innerHTML = html;
}

/* ============================================
 *  推荐加载（核心新功能）
 * ============================================ */
async function loadRecommend(category = '') {
  currentCategory = category;
  currentMode = 'recommend';
  renderCategories();

  const container = document.getElementById('searchResults');
  const header = document.getElementById('listHeader');
  const titleEl = document.getElementById('listTitle');
  const refreshBtn = document.getElementById('refreshBtn');

  // 清空搜索框
  document.getElementById('searchInput').value = '';

  header.classList.remove('hidden');
  refreshBtn.classList.remove('hidden');
  refreshBtn.disabled = true;
  titleEl.textContent = category ? `📚 ${category} · 精选` : '🔥 热门推荐';
  setStatus(container, loadingHTML(category ? `正在加载「${category}」…` : '正在为你推荐…'));

  // 随机综合推荐：随机抽 3 个分类并行请求
  let keywords;
  if (category) {
    keywords = [category];
  } else {
    keywords = [...CATEGORIES].sort(() => Math.random() - 0.5).slice(0, 3);
  }

  try {
    const results = await Promise.allSettled(
      keywords.map(kw =>
        fetch(`${API_BASE}/books?query=${encodeURIComponent(kw)}&limit=12`)
          .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      )
    );

    // 合并去重
    const map = new Map();
    results.forEach(r => {
      if (r.status === 'fulfilled' && Array.isArray(r.value.books)) {
        r.value.books.forEach(b => {
          if (b && b._id && !map.has(b._id)) map.set(b._id, b);
        });
      }
    });

    let books = [...map.values()];
    // 随机打乱后取前 20 本
    books = books.sort(() => Math.random() - 0.5).slice(0, 20);

    if (!books.length) {
      setStatus(container, errorHTML('推荐加载失败，点「换一批」重试'));
      return;
    }
    renderBooks(books, container);
  } catch (err) {
    console.error('推荐加载失败:', err);
    setStatus(container, errorHTML('推荐加载失败，点「换一批」重试'));
  } finally {
    refreshBtn.disabled = false;
  }
}

/* 换一批 */
function refreshList() {
  if (currentMode === 'search') {
    doSearch();
  } else {
    loadRecommend(currentCategory);
  }
}

/* ============================================
 *  搜索
 * ============================================ */
async function doSearch() {
  const keyword = document.getElementById('searchInput').value.trim();
  if (!keyword) {
    loadRecommend(currentCategory);
    return;
  }

  currentMode = 'search';
  const btn = document.getElementById('searchBtn');
  const results = document.getElementById('searchResults');
  const header = document.getElementById('listHeader');
  const titleEl = document.getElementById('listTitle');
  const refreshBtn = document.getElementById('refreshBtn');

  // 搜索时取消分类高亮
  currentCategory = '';
  renderCategories();

  header.classList.remove('hidden');
  titleEl.textContent = `🔍 “${keyword}” 的搜索结果`;
  refreshBtn.classList.remove('hidden');

  btn.disabled = true;
  setStatus(results, loadingHTML('正在搜索…'));

  try {
    const url = `${API_BASE}/books?query=${encodeURIComponent(keyword)}&limit=30`;
    const res = await fetch(url);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();
    renderBooks(data.books || [], results);
  } catch (err) {
    console.error('搜索失败:', err);
    setStatus(results, errorHTML('搜索请求失败，请检查网络后重试'));
  } finally {
    btn.disabled = false;
  }
}

/* ============================================
 *  打开书籍详情
 * ============================================ */
async function openBook(bookId) {
  showView('detail');
  const view = document.getElementById('viewDetail');
  setStatus(view, loadingHTML('正在加载书籍信息…'));

  try {
    const [detailRes, chaptersRes] = await Promise.all([
      fetch(`${API_BASE}/book/${bookId}`).then(r => { if (!r.ok) throw new Error(); return r.json(); }),
      fetch(`${API_BASE}/book/${bookId}/chapters`).then(r => { if (!r.ok) throw new Error(); return r.json(); })
    ]);

    currentBook = detailRes;
    currentChapters = chaptersRes.chapters || [];

    let html = `
      <div class="detail-header">
        ${coverImg(detailRes.cover, 100, 140, '8px')}
        <div class="info">
          <h2>${escapeHtml(detailRes.title)}</h2>
          <div class="meta">
            ${escapeHtml(detailRes.author)} ·
            ${escapeHtml(detailRes.cat || '')} ·
            ${escapeHtml(detailRes.zt || '')} ·
            ${detailRes.chaptersCount || currentChapters.length} 章
          </div>
          <div class="desc">${escapeHtml(detailRes.longIntro || detailRes.shortIntro || '暂无简介')}</div>
        </div>
      </div>
      <h3 style="font-size:15px;margin-bottom:12px;color:var(--text-light);">
        章节目录（共 ${currentChapters.length} 章）
      </h3>
      <div class="chapter-list">`;

    currentChapters.forEach((ch, idx) => {
      const cls = readSet.has(ch.id) ? 'chapter-item read' : 'chapter-item';
      html += `<div class="${cls}" onclick="openChapter(${idx})">${escapeHtml(ch.title)}</div>`;
    });

    html += '</div>';
    view.innerHTML = html;
  } catch (err) {
    console.error('加载书籍失败:', err);
    setStatus(view, errorHTML('加载书籍信息失败'));
  }
}

/* ============================================
 *  打开章节
 * ============================================ */
async function openChapter(index) {
  if (index < 0 || index >= currentChapters.length) return;
  currentChapterIndex = index;
  const chapter = currentChapters[index];

  showView('reader');
  const view = document.getElementById('viewReader');
  setStatus(view, loadingHTML('正在加载章节内容…'));

  try {
    const res = await fetch(`${API_BASE}/chapter/${chapter.id}`);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();

    let body = data.chapter && data.chapter.body ? data.chapter.body : (data.body || '');
    let bodyHtml = body
      .split(/\n+/)
      .filter(line => line.trim())
      .map(line => `<p>${escapeHtml(line.trim())}</p>`)
      .join('');

    if (!bodyHtml) {
      bodyHtml = '<p style="color:var(--text-light);text-align:center;">本章内容为空</p>';
    }

    readSet.add(chapter.id);

    const hasPrev = index > 0;
    const hasNext = index < currentChapters.length - 1;

    view.innerHTML = `
      <div class="reader-title">${escapeHtml(chapter.title)}</div>
      <div class="reader-content">${bodyHtml}</div>
      <div class="reader-nav">
        <button ${hasPrev ? '' : 'disabled'} onclick="openChapter(${index - 1})">← 上一章</button>
        <span class="page-info">${index + 1} / ${currentChapters.length}</span>
        <button ${hasNext ? '' : 'disabled'} onclick="openChapter(${index + 1})">下一章 →</button>
      </div>`;

    window.scrollTo({ top: 0, behavior: 'smooth' });
  } catch (err) {
    console.error('加载章节失败:', err);
    setStatus(view, errorHTML('加载章节内容失败'));
  }
}

/* ============================================
 *  返回导航
 * ============================================ */
function goBack() {
  const readerVisible = !document.getElementById('viewReader').classList.contains('hidden');
  const detailVisible = !document.getElementById('viewDetail').classList.contains('hidden');

  if (readerVisible && currentBook) {
    openBook(currentBook._id);         // 阅读页 → 详情页
  } else if (detailVisible) {
    showView('search');                // 详情页 → 首页
    currentBook = null;
    currentChapters = [];
    loadRecommend(currentCategory);    // 恢复推荐
  }
}

/* ============================================
 *  初始化：打开即加载推荐
 * ============================================ */
renderCategories();
loadRecommend('');
</script>
</body>
</html>
